name: offline

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
          cache: pip
      - name: Install offline development dependencies
        run: python -m pip install -e ".[all,dev]"
      - name: Run offline tests
        run: python -m pytest
      - name: Build wheel and source distribution
        run: python -m build --sdist --wheel
      - name: Build portable six-skill plugin
        run: python -B scripts/build_plugin.py --output dist
